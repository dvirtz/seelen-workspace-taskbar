<main id="workspace-taskbar" class="workspace-taskbar" aria-label="Workspace taskbar">
  <section class="taskbar-surface">
    <div id="workspace-badge" class="workspace-badge" title="Current Seelen workspace"></div>
    <div id="task-items" class="task-items" role="toolbar" aria-label="Applications"></div>
    <div id="empty-state" class="empty-state" hidden>No windows here yet</div>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
