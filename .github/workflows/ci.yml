name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Type-check and build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/create-github-app-token@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
        id: app-token
        with:
          client-id: ${{ vars.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract Seelen CLI
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'seelen.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'seelen'
          Invoke-WebRequest 'https://github.com/eythaann/Seelen-UI/releases/download/v2.8.4/Seelen.UI_2.8.4.0_x64.Msix' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $cli = @(Get-ChildItem -LiteralPath $destination -Filter slu.exe -Recurse)
          if ($cli.Count -ne 1) { throw 'Expected exactly one Seelen CLI executable' }
          "SLU_PATH=$($cli[0].FullName)" >> $env:GITHUB_ENV

      - name: Type-check and bundle
        run: npm run bundle

      - name: Run semantic-release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
