name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Live Seelen tests
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install and start Seelen
        shell: pwsh
        run: ./scripts/ci-seelen.ps1
      - run: npm run load
      - name: Create a second workspace
        shell: pwsh
        run: |
          & $env:SLU_PATH vd create-new-workspace
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the second test workspace.' }
      - name: Run live tests
        run: npm run test
      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-diagnostics | Out-Null
          Get-Process | Select-Object Name,Id,SessionId | Out-File ci-diagnostics/processes.txt
          Get-CimInstance Win32_Process | Where-Object Name -Match 'seelen|slu-service|msedgewebview2' | Select-Object Name,ProcessId,CommandLine | Format-List | Out-File ci-diagnostics/seelen-processes.txt
          Get-NetTCPConnection -State Listen | Select-Object LocalAddress,LocalPort,OwningProcess | Out-File ci-diagnostics/listeners.txt
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds = [Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = [Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
          $graphics = [Drawing.Graphics]::FromImage($bitmap)
          try {
            $graphics.CopyFromScreen($bounds.Location, [Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $PWD 'ci-diagnostics/desktop.png'))
          } finally { $graphics.Dispose(); $bitmap.Dispose() }
          foreach ($root in @($env:LOCALAPPDATA, $env:APPDATA)) {
            $logs = Join-Path $root 'com.seelen.seelen-ui/logs'
            if (Test-Path $logs) { Copy-Item $logs "ci-diagnostics/$([IO.Path]::GetFileName($root))-logs" -Recurse }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seelen-test-results
          path: |
            playwright-report/
            test-results/
            ci-diagnostics/
          retention-days: 7

  build:
    name: Type-check and build
    runs-on: windows-latest
    needs: test
    timeout-minutes: 20

    steps:
      - uses: actions/create-github-app-token@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
        id: app-token
        with:
          client-id: ${{ vars.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract Seelen CLI
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'seelen.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'seelen'
          Invoke-WebRequest 'https://github.com/eythaann/Seelen-UI/releases/download/v2.8.4/Seelen.UI_2.8.4.0_x64.Msix' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $cli = @(Get-ChildItem -LiteralPath $destination -Filter slu.exe -Recurse)
          if ($cli.Count -ne 1) { throw 'Expected exactly one Seelen CLI executable' }
          "SLU_PATH=$($cli[0].FullName)" >> $env:GITHUB_ENV

      - name: Type-check and bundle
        run: npm run bundle

      - name: Run semantic-release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
